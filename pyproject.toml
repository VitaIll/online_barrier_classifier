[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
norecursedirs = ["_pending", "_pending_until_implemented", "_archive"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-ra",
    "--ignore=tests/_pending",
]
markers = [
    "requires_data: test requires the cleansed Binance parquet (skipped if absent)",
    "slow: test takes longer than 5 seconds",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # line length handled by black

[tool.black]
line-length = 100
target-version = ["py310"]
