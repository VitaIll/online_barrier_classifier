name: baseline
description: |
  Streaming ThresholdGate on default-features, no offline model.
  Reference experiment — every other spec should beat this on calibration.

  Data path is resolved by experiment lookup: prefer
  `data/synthetic/btcusdt_1m.parquet` (generated by `wagie data synth`),
  fall back to `data/cleansed_data/BTCUSDT/1m.parquet` for full backtests.
seed: 42

wagie:
  data:
    parquet_path: data/synthetic/btcusdt_1m.parquet
    m_minutes: 20
  model:
    catboost_path: null
    arf:
      n_models: 10
      lambda_value: 6.0
      seed: 42
  strategy:
    kind: threshold_gate
    tau: 0.20
  broker:
    inventory_cap: 5
  runtime:
    warmup_samples: 96

features:
  catalog: default
  n_features: null
  regime_feature: parkinson_var_rolling_mean_24
  regime_edges: [1.0e-6, 1.0e-5]
  regime_labels: [low, med, high]

charts:
  enable: true
  n_calibration_bins: 10

report:
  enable: true
  title: "baseline — threshold gate"

artifacts:
  save_state: true
  save_predictions: true
