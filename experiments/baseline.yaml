name: baseline
description: |
  Streaming PureConformalGate on default-features, no offline model.
  Reference experiment — every other spec should beat this on calibration.
seed: 42

wagie:
  data:
    parquet_path: data/processed/btcusdt_1m.parquet
    m_minutes: 20
  model:
    catboost_path: null
    arf:
      n_models: 10
      lambda_value: 6.0
      seed: 42
    aci:
      alphas: [0.05, 0.10, 0.20]
      gamma: 0.01
      n_regimes: 3
      q_init: 0.5
  strategy:
    kind: pure_conformal
    alpha: 0.10
  broker:
    inventory_cap: 5
  runtime:
    warmup_samples: 96

features:
  catalog: default
  n_features: null
  regime_feature: parkinson_var_rolling_mean_24
  regime_edges: [1.0e-6, 1.0e-5]
  regime_labels: [low, med, high]

charts:
  enable: true
  n_calibration_bins: 10

report:
  enable: true
  title: "baseline — pure conformal gate"

artifacts:
  out_dir: artifacts/runs
  save_state: true
  save_predictions: true
