# Feature pipeline configuration
decision_interval: 20  # Minutes per decision bar

# Rolling window sizes (in decision bars)
windows: [1, 2, 4, 8, 12, 24, 48, 96]

# Rolling statistics to compute
rolling_stats: ["mean", "var", "min", "max", "iqr", "ptp"]

# Base features for rolling computation
rolling_base_features:
  - "return"
  - "abs_return"
  - "squared_return"
  - "range_hl"
  - "range_pct"
  - "parkinson_var"
  - "garman_klass_var"
  - "log_volume"
  - "log_quote_volume"
  - "imbalance"
  - "buy_ratio"
  - "illiq"
  - "close_to_vwap"

# Lagged features (per decision bar)
lags: [1, 2, 3, 5, 10]
lag_features:
  - "return"
  - "abs_return"
  - "range_hl"
  - "log_volume"
  - "imbalance"
  - "buy_ratio"
  - "close_to_vwap"

# Expanding (since-segment-start) statistics
expanding_stats: ["mean", "var", "skew"]
expanding_features:
  - "return"
  - "range_hl"
  - "log_volume"
  - "log_quote_volume"
  - "imbalance"
  - "illiq"

# Label configuration
barrier:
  # Alpha calibration uses the chronological split fraction in config/model.yaml (train_fraction)
  # Method: "quantile" or "fixed"
  method: "quantile"
  # For quantile method: target positive class rate
  quantile: 0.9
  # For fixed method: log-return threshold
  fixed_alpha: 0.002

# Burn-in: number of decision bars to skip for rolling stabilization
burn_in_bars: 96  # max(windows)
