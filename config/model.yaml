# Model configuration

# Train/test split (chronological)
train_fraction: 0.6
val_fraction: 0.2  # fraction of the training window reserved for early stopping

# --- Offline Model (CatBoost) ---
catboost:
  iterations: 6000
  learning_rate: 0.007
  depth: 6
  loss_function: "Logloss"
  eval_metric: "Logloss"
  l2_leaf_reg: 1.0
  random_seed: 42
  bootstrap_type: 'MVS'
  use_best_model: True
  grow_policy: 'SymmetricTree'
  leaf_estimation_method: 'Newton'
  leaf_estimation_iterations: 10
  auto_class_weights: 'SqrtBalanced'
  boosting_type: 'Ordered'
  langevin: True
  diffusion_temperature: 15000
  rsm: 0.9
  mvs_reg: 10
  verbose: 100
  subsample: 0.65

  early_stopping_rounds: 100

# Feature selection for online model
top_k_features: 120  # Number of features to pass to online model

# --- Online Model (River ARF) ---
online:
  model_type: "ARFClassifier"
  seed: 42

  # Ensemble stability
  n_models: 100
  max_features: "log2"     # more diversity than sqrt; often helps in noisy streams
  lambda_value: 6          # leveraging bagging default is a good baseline

  # Use a probability-sensitive metric for weighting trees
  metric: "CrossEntropy"
  disable_weighted_vote: false

  # Drift handling (make it less trigger-happy than defaults)
  warning_detector:
    type: "ADWIN"
    delta: 0.005
    clock: 64
  drift_detector:
    type: "ADWIN"
    delta: 0.0005
    clock: 64

  # Tree growth (reduce noise-chasing)
  grace_period: 200
  max_depth: 15
  split_criterion: "hellinger"
  delta: 0.001
  tau: 0.01

  # Leaves (more stable probabilities)
  leaf_prediction: "nba"
  nb_threshold: 50

  # Memory / robustness
  max_size: 20.0
  remove_poor_attrs: true
  merit_preprune: true

# --- Evaluation ---
evaluation:
  # Reporting cadence during online loop
  report_every_bars: 100
  # Probability threshold for binary predictions
  threshold: 0.5
