name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  contract-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Smoke test (imports)
        run: python -c "import wagie; print(wagie.__version__)"
      # Canary FIRST. If T7 (no-leakage cheat-feature canary) does not pass,
      # nothing else matters — every reported metric is suspect. This step
      # gates the rest of the suite per RESEARCH/HEALTH_OF_RESULTS.md.
      - name: T7 cheat-feature canary (gates everything)
        run: python -m pytest tests/contracts/test_no_leakage_canary.py -v --tb=short
      - name: Run contract tests
        run: python -m pytest tests/contracts/ -v --tb=short
      # Integration tests run AFTER contracts. These cover the
      # ExperimentProtocol end-to-end + replay-determinism assertions that
      # used to never run in CI (audit finding).
      - name: Run integration tests
        run: python -m pytest tests/integration/ -v --tb=short
      - name: CLI smoke
        run: python -m wagie info

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check src/wagie/
